name: conformance

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements/dev.lock
      - name: Install pinned tools and package
        run: |
          python -m pip install --require-hashes -r requirements/dev.lock
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check
      - name: Static checks
        run: |
          ruff check .
          ruff format --check .
          mypy src
      - name: Schema and artifact integrity
        run: |
          python scripts/generate_schemas.py --check
          python scripts/check_artifacts.py
          aging-clock registry validate
      - name: Tests including MCP protocol
        run: pytest --cov=aging_clock_conformance --cov-report=term-missing --junitxml=reports/tests.xml
      - name: Reference evidence
        run: |
          mkdir -p reports
          aging-clock conformance run horvath-2013 --json > reports/python-fsum.json
          aging-clock conformance run horvath-2013 --implementation python-decimal --json > reports/python-decimal.json
          aging-clock compare --clock horvath-2013 --json > reports/comparison.json
      - name: Reproducible build and installed wheel
        run: python scripts/check_build.py
      - name: Public conformance reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: evidence-python-${{ matrix.python }}
          path: reports/
          retention-days: 14
          if-no-files-found: ignore
